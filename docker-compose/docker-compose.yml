version: '3.8'

services:
  frontend:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: job-scraper-frontend
    env_file:
      - .env
    environment:
      - INTERNAL_API_URL=http://api:8000
    ports:
      - "3000:3000"
    networks:
      - job-scraper-network
    restart: unless-stopped

networks:
  job-scraper-network:
    external: true
